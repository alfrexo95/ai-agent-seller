name: AI Agent Worker

on:
  schedule:
    - cron: '0 */12 * * *' # Cada 12 horas (00:00 y 12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Margen de seguridad para 15 mins de trabajo + instalación
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Agent Worker
        env:
          AGENTSOUK_API_KEY: ${{ secrets.AGENTSOUK_API_KEY }}
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: python agent_worker.py
      - name: Guardar estado
        run: |
          git config user.name "agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pending_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: Estado de trabajos"
            git pull --rebase || true
            git push
          fi
