name: AI Agent Worker 24/7

on:
  schedule:
    - cron: '0 */6 * * *' # Se despierta cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos bots se solapen
concurrency:
  group: agent-worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # El límite máximo de GitHub es 6 horas (360 min)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Agent Worker
        env:
          AGENTSOUK_API_KEY: ${{ secrets.AGENTSOUK_API_KEY }}
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: |
          if [ -z "${AGENTSOUK_API_KEY:-}" ] || [ -z "${UCASH_API_KEY:-}" ]; then
            echo "Seller worker skipped: required marketplace credentials are not configured."
            exit 0
          fi
          python agent_worker.py

      - name: Register AI Agent Seller in Predator Hub (optional)
        continue-on-error: true
        env:
          HUB_TOKEN: ${{ secrets.INFRA_HUB_TOKEN }}
          HUB_URL: https://x402-api-wigc.onrender.com
        run: |
          if [ -z "${HUB_TOKEN:-}" ]; then echo "Hub registration skipped: token not configured"; exit 0; fi
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"agent_id":"ai-agent-seller","platform":"github-actions","capabilities":["agent.marketplace","job.execution","payment.verify"]}' \
            "$HUB_URL/infra/agents/register"
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$HUB_URL/infra/agents/ai-agent-seller/heartbeat"
          # Read-only MCP discovery; no paid service routes are invoked.
          services_payload='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_services","arguments":{}}}'
          routes_payload='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_routes","arguments":{}}}'
          curl -fsS --max-time 20 -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" -d "$services_payload" "$HUB_URL/mcp" -o /tmp/hub-services.json
          curl -fsS --max-time 20 -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" -d "$routes_payload" "$HUB_URL/mcp" -o /tmp/hub-routes.json
          python3 - <<'PY'
          import json
          services=json.load(open("/tmp/hub-services.json"))["result"]["structuredContent"]["services"]
          routes=json.load(open("/tmp/hub-routes.json"))["result"]["structuredContent"]["routes"]
          print(f"MCP catalog discovery: {len(services)} services/workers, {len(routes)} route definitions.")
          PY
      - name: Guardar estado
        run: |
          git config user.name "agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pending_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: Estado y Heartbeat"
            git pull --rebase || true
            git push
          fi
