name: AI Agent Worker

on:
  schedule:
    - cron: '*/15 * * * *' # Cada 15 minutos
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install agentsouk agents-u-cash
      - name: Run Agent Worker
        env:
          AGENTSOUK_API_KEY: ${{ secrets.AGENTSOUK_API_KEY }}
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: python agent_worker.py
