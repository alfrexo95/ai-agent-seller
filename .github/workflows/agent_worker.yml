name: AI Agent Worker 24/7

on:
  schedule:
    - cron: '0 */6 * * *' # Se despierta cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos bots se solapen
concurrency:
  group: agent-worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # El límite máximo de GitHub es 6 horas (360 min)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Agent Worker
        env:
          AGENTSOUK_API_KEY: ${{ secrets.AGENTSOUK_API_KEY }}
          UCASH_API_KEY: ${{ secrets.UCASH_API_KEY }}
        run: python agent_worker.py
      - name: Guardar estado
        run: |
          git config user.name "agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pending_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: Estado y Heartbeat"
            git pull --rebase || true
            git push
          fi
